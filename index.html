<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Scooter Milano</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scooter">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e9ece6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root {
  --ground: #e9ece6;
  --block: #dde2da;
  --road: #ffffff;
  --road-edge: #c9cfc4;
  --road-major: #fff6e3;
  --road-major-edge: #d8c79f;
  --road-no: #c3c8bf;
  --ped: #d3d9ce;
  --ink: #1e2729;
  --ink-soft: #56615f;
  --ink-faint: #8a938f;
  --panel: #fbfbf8;
  --panel-line: #d9ddd4;
  --accent: #e2621b;
  --accent-soft: #f7c7a6;
  --accent-ink: #ffffff;
  --moto-only: #ef8a3f;
  --car: #4d6a8a;
  --fix: #b0306b;
  --good: #1d7a55;
  --park: #d3e5c8; --water: #b7d5e6; --building: #dcdfd7; --rail: #aeb4ab; --metro: #d4232b;
  --shadow: 0 6px 24px rgba(30, 39, 41, .16);
  --font-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --font-cond: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #151b1d; --block: #1b2225; --road: #2c3538; --road-edge: #1f272a;
    --road-major: #3b3a31; --road-major-edge: #2a2a22; --road-no: #2a3134; --ped: #242c2e;
    --ink: #e7ebe8; --ink-soft: #aab4b1; --ink-faint: #76817e;
    --panel: #1d2427; --panel-line: #313b3e;
    --accent: #ff7f3a; --accent-soft: #6b3a1e; --accent-ink: #1a0f08; --moto-only: #ff9a55;
    --car: #8fb0d4; --fix: #f06aa6; --good: #54c894;
    --park: #1e2d23; --water: #1a3240; --building: #21292c; --rail: #3d4749; --metro: #e2474e;
    --shadow: 0 6px 24px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #151b1d; --block: #1b2225; --road: #2c3538; --road-edge: #1f272a;
  --road-major: #3b3a31; --road-major-edge: #2a2a22; --road-no: #2a3134; --ped: #242c2e;
  --ink: #e7ebe8; --ink-soft: #aab4b1; --ink-faint: #76817e;
  --panel: #1d2427; --panel-line: #313b3e;
  --accent: #ff7f3a; --accent-soft: #6b3a1e; --accent-ink: #1a0f08; --moto-only: #ff9a55;
  --car: #8fb0d4; --fix: #f06aa6; --good: #54c894;
  --park: #1e2d23; --water: #1a3240; --building: #21292c; --rail: #3d4749; --metro: #e2474e;
  --shadow: 0 6px 24px rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
#app { position: relative; height: 100%; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: grab; }
#map.dragging { cursor: grabbing; }

/* Barra in alto: partenza e arrivo */
.top { position: absolute; left: 0; right: 0; top: 0; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; display: flex; flex-direction: column; gap: 8px; pointer-events: none; z-index: 5; }
.trip { pointer-events: auto; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; display: grid; grid-template-columns: 1fr auto; gap: 4px; max-width: 520px; width: 100%; }
.fields { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.field { position: relative; display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 9px; }
.field:focus-within { background: var(--ground); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dot.from { border: 2.5px solid var(--ink); background: var(--panel); }
.dot.to { background: var(--accent); box-shadow: 0 0 0 2.5px var(--panel), 0 0 0 4px var(--accent); }
.field label { font-family: var(--font-cond); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); width: 22px; flex: none; }
.field input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 500 16px var(--font-body); padding: 6px 0; outline: none; }
.field input::placeholder { color: var(--ink-faint); }
.swap { align-self: center; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--panel-line); background: var(--panel); color: var(--ink-soft); display: grid; place-items: center; cursor: pointer; }
.swap:hover { color: var(--ink); }
.swap:focus-visible, button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.suggest { pointer-events: auto; max-width: 520px; width: 100%; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; max-height: 50vh; overflow-y: auto; }
.suggest button { display: flex; width: 100%; text-align: left; gap: 10px; align-items: baseline; border: 0; background: transparent; color: var(--ink); padding: 11px 14px; font: 500 15px var(--font-body); cursor: pointer; border-bottom: 1px solid var(--panel-line); }
.suggest button:last-child { border-bottom: 0; }
.suggest button:hover, .suggest button.active { background: var(--ground); }
.suggest small { color: var(--ink-faint); font-size: 12px; margin-left: auto; white-space: nowrap; }

.chips { pointer-events: auto; display: flex; gap: 6px; overflow-x: auto; max-width: 520px; width: 100%; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--panel-line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: 600 13px var(--font-body); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.chip:hover { border-color: var(--ink-faint); }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* Pulsanti mappa */
.tools { position: absolute; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 4; }
.tool { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--panel-line); background: var(--panel); color: var(--ink); box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer; font: 600 20px var(--font-body); }
.tool.on { background: var(--fix); color: #fff; border-color: var(--fix); }
.tool.rain.on { background: var(--car); border-color: var(--car); color: #fff; }
.rainbar { padding: 8px 14px; border-top: 1px solid var(--panel-line); font-size: 13.5px; color: var(--ink-soft); display: flex; gap: 8px; align-items: center; }
.rainbar b { color: var(--car); font-weight: 600; }
.sub2 { font-size: 12px; color: var(--ink-faint); }
.warn { font-size: 13px; color: var(--fix); line-height: 1.35; }
.accbar { padding: 8px 14px; border-top: 1px solid var(--panel-line); }
.accbar .warn, .accbar p { margin: 0; }
.backup textarea { width: 100%; min-height: 84px; border: 1px solid var(--panel-line); border-radius: 10px; background: var(--ground); color: var(--ink); font: 12px/1.35 ui-monospace, Menlo, monospace; padding: 8px; resize: vertical; }
.pane h4 { margin: 4px 0 0; font: 700 16px/1.2 var(--font-cond); letter-spacing: .02em; }

/* Scheda in basso */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; padding: 0 16px calc(12px + env(safe-area-inset-bottom, 0px)); pointer-events: none; display: flex; justify-content: center; }
.card { pointer-events: auto; width: 100%; max-width: 520px; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.more { display: flex; flex-direction: column; gap: 10px; }
/* schede di testo (correzioni, punto toccato): mai oltre meta' schermo, cosi' la mappa resta toccabile; si scorrono */
.card .pane { max-height: 50vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
/* schermi bassi (es. iPhone SE): + e - sono un doppione del pizzico con due dita */
@media (max-height: 620px) { #zin, #zout { display: none; } }
.card-head { display: flex; align-items: stretch; gap: 0; border: 0; background: transparent; width: 100%; padding: 0; color: inherit; text-align: left; cursor: pointer; }
.mode { flex: 1; padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mode + .mode { border-left: 1px solid var(--panel-line); }
.mode .lab { font-family: var(--font-cond); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); display: flex; align-items: center; gap: 6px; }
.mode .lab i { width: 18px; height: 4px; border-radius: 2px; display: inline-block; }
.mode .big { font-family: var(--font-cond); font-weight: 700; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.mode .big small { font-size: 18px; font-weight: 600; margin-left: 2px; }
.mode .sub { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.mode.moto .big { color: var(--accent); }
.mode.car .big { color: var(--car); }
.gain { padding: 8px 14px; border-top: 1px solid var(--panel-line); font-size: 14px; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; }
.gain b { color: var(--good); font-weight: 600; }
.gain .more { margin-left: auto; font-family: var(--font-cond); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; color: var(--ink-faint); }
.steps { max-height: 34vh; overflow-y: auto; border-top: 1px solid var(--panel-line); }
.step { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; padding: 9px 14px; border-bottom: 1px solid var(--panel-line); }
.step:last-child { border-bottom: 0; }
.step .ic { width: 26px; height: 26px; border-radius: 8px; background: var(--ground); display: grid; place-items: center; color: var(--ink-soft); }
.step .nm { font-weight: 500; min-width: 0; }
.step .nm span { display: block; font-size: 12px; color: var(--ink-faint); font-weight: 400; }
.step .nm span.tag { display: inline-block; font-size: 11px; color: var(--ink); font-weight: 600; }
.step .ds { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 13px; }
.tag { display: inline-block; margin-left: 6px; font: 600 11px var(--font-cond); letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; background: var(--accent-soft); color: var(--ink); vertical-align: 1px; }
.note { padding: 10px 14px; font-size: 12.5px; color: var(--ink-faint); border-top: 1px solid var(--panel-line); line-height: 1.4; }

/* Scheda correzione / punto */
.pane { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.pane h3 { margin: 0; font: 700 22px/1.1 var(--font-cond); letter-spacing: .01em; text-wrap: balance; }
.pane p { margin: 0; color: var(--ink-soft); font-size: 14px; line-height: 1.4; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.facts dt { color: var(--ink-faint); }
.facts dd { margin: 0; font-weight: 500; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { border: 1px solid var(--panel-line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 11px 10px; font: 600 14px var(--font-body); cursor: pointer; text-align: center; }
.btn:hover { border-color: var(--ink-faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.fix { background: var(--fix); border-color: var(--fix); color: #fff; }
.btn.sel { outline: 2px solid var(--fix); outline-offset: 1px; }
.btn.wide { grid-column: 1 / -1; }
.row { display: flex; gap: 8px; align-items: center; }
.row .btn { flex: 1; }
.banner { position: absolute; left: 50%; transform: translateX(-50%); z-index: 5; background: var(--fix); color: #fff; font: 600 13px var(--font-body); padding: 7px 12px; border-radius: 999px; box-shadow: var(--shadow); white-space: nowrap; }
.toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 9; background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-soft); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; }
.go { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid var(--panel-line); }
.go .btn.primary { font-size: 16px; padding: 12px 10px; }
[hidden] { display: none !important; }
body.navmode .top, body.navmode .tools, body.navmode .sheet, body.navmode .banner { display: none; }
.navtop { position: absolute; left: 16px; right: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 7; background: var(--ink); color: var(--panel); border-radius: 16px; box-shadow: var(--shadow); display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; padding: 12px 14px; max-width: 520px; margin: 0 auto; }
.nt-ic { width: 64px; height: 64px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.nt-dist { font: 700 40px/1 var(--font-cond); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.nt-name { font: 500 18px/1.2 var(--font-body); margin-top: 4px; overflow-wrap: anywhere; }
.nt-name .tag { color: var(--ink); }
.navbot { position: absolute; left: 16px; right: 16px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 7; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; max-width: 520px; margin: 0 auto; }
.nb-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.nb-info b { font: 700 28px/1 var(--font-cond); color: var(--accent); font-variant-numeric: tabular-nums; }
.nb-info span { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.navbot .tool { box-shadow: none; }
.navbot .btn { padding: 12px 16px; }
.recenter { position: absolute; right: 16px; z-index: 7; }
.closepick { position: absolute; left: 16px; right: 16px; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 8; max-width: 520px; margin: 0 auto; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 16px; box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.closepick h4 { margin: 0; font: 700 18px/1.2 var(--font-cond); }
.closepick .btn { width: 100%; font-size: 16px; padding: 13px 10px; }
@media (prefers-reduced-motion: no-preference) { .card, .suggest { animation: rise .18s ease-out; } @keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } } }
</style>
</head>
<body>
<div id="app">
  <canvas id="map" aria-label="Mappa di Milano"></canvas>

  <div class="top">
    <div class="trip">
      <div class="fields">
        <div class="field"><span class="dot from"></span><label for="q-from">Da</label><input id="q-from" autocomplete="off" placeholder="Partenza: via, civico o preferito" enterkeyhint="search"></div>
        <div class="field"><span class="dot to"></span><label for="q-to">A</label><input id="q-to" autocomplete="off" placeholder="Arrivo: via, civico o preferito" enterkeyhint="search"></div>
      </div>
      <button class="swap" id="swap" title="Inverti partenza e arrivo" aria-label="Inverti partenza e arrivo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>
      </button>
    </div>
    <div class="suggest" id="suggest" hidden></div>
    <div class="chips" id="chips" aria-label="Posti preferiti"></div>
  </div>

  <div class="tools" id="tools">
    <button class="tool" id="fixmode" title="Correggi le strade" aria-label="Correggi le strade" aria-pressed="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
    <button class="tool rain" id="rainmode" title="Modalità pioggia" aria-label="Modalità pioggia" aria-pressed="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 18 0Z"/><path d="M12 12v7a2 2 0 0 1-4 0"/></svg>
    </button>
    <button class="tool" id="zin" aria-label="Avvicina">+</button>
    <button class="tool" id="zout" aria-label="Allontana">−</button>
    <button class="tool" id="fit" title="Inquadra il percorso" aria-label="Inquadra il percorso">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
  <div class="banner" id="banner" hidden>Modo correzione: tocca una strada</div>

  <div class="sheet"><div class="card" id="card"></div></div>
  <div class="toast" id="toast" hidden></div>

  <div class="closepick" id="closepick" hidden></div>
  <div class="navtop" id="navtop" hidden>
    <div class="nt-ic" id="nt-ic"></div>
    <div><div class="nt-dist" id="nt-dist"></div><div class="nt-name" id="nt-name"></div></div>
  </div>
  <button class="tool recenter" id="nb-center" hidden aria-label="Ricentra sulla tua posizione" title="Ricentra">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 19 20l-7-4-7 4Z"/></svg>
  </button>
  <div class="navbot" id="navbot" hidden>
    <div class="nb-info"><b id="nb-min"></b><span id="nb-rest"></span></div>
    <button class="tool" id="nb-closed" aria-label="Strada chiusa" title="Strada chiusa">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M7 12h10"/></svg>
    </button>
    <button class="tool" id="nb-voice" aria-label="Voce accesa" title="Voce">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4Z"/><path id="nb-wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path id="nb-mute" d="M16 9l6 6M22 9l-6 6" style="display:none"/></svg>
    </button>
    <button class="btn fix" id="nb-stop">Fine</button>
  </div>
</div>

<script>
// Motore di calcolo percorsi per l'app scooter (funziona nel browser e in Node per i test)
(function (root) {
  'use strict';

  // indice classi: trunk, primary, secondary, tertiary, residential, living_street, service, pedestrian, motorway
  const SPEED = {
    moto: [40, 32, 28, 25, 21, 12, 12, 10, 50],
    car: [38, 28, 25, 22, 18, 10, 10, 8, 50],
  };
  const SIGNAL_S = { moto: 6, car: 10 };
  const LEFT_S = { moto: 6, car: 10 };
  const RIGHT_S = { moto: 2, car: 4 };
  const SERVICE_S = 30;
  const WALK_S = 1.5; // arrivo: ogni metro in piu' a piedi "costa" 1,5 secondi

  class MinHeap {
    constructor() { this.k = []; this.v = []; }
    push(key, val) {
      const k = this.k, v = this.v; let i = k.length; k.push(key); v.push(val);
      while (i > 0) { const p = (i - 1) >> 1; if (k[p] <= key) break; k[i] = k[p]; v[i] = v[p]; i = p; }
      k[i] = key; v[i] = val;
    }
    pop() {
      const k = this.k, v = this.v; const topK = k[0], topV = v[0];
      const lk = k.pop(), lv = v.pop(); const n = k.length;
      if (n > 0) {
        let i = 0;
        while (true) {
          let l = 2 * i + 1; if (l >= n) break; const r = l + 1;
          if (r < n && k[r] < k[l]) l = r;
          if (k[l] >= lk) break;
          k[i] = k[l]; v[i] = v[l]; i = l;
        }
        k[i] = lk; v[i] = lv;
      }
      return [topK, topV];
    }
    get size() { return this.k.length; }
  }

  function angleDiff(a, b) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }

  class Router {
    constructor(data) {
      this.d = data;
      const E = data.edges, N = data.nodes;

  // a fine viaggio (o prima di un ricalcolo): tempo vero di ogni tratto percorso -> memoria dei tempi
  function recFlush() {
    const r = nav.rec; nav.rec = null;
    if (!r || r.pts.length < 5) return !!(r && r.counted);
    const P = r.pts, route = r.route;
    // pezzi di guida continua: le soste lunghe (fermo per piu' di 90 s) non sono traffico e si tolgono
    const runs = []; let cur = [], still = 0;
    for (let i = 0; i < P.length; i++) {
      if (P[i][1] - P[still][1] > 5) still = i;
      cur.push(P[i]);
      if (P[i][0] - P[still][0] > 90000) {
        cur.splice(cur.length - (i - still)); if (cur.length > 1) runs.push(cur);
        cur = [P[i]]; still = i;
      }
    }
    if (cur.length > 1) runs.push(cur);
    const tAt = (run, a) => { // ora in cui sei passato dal punto a (interpolazione)
      let i = 0; while (i + 1 < run.length - 1 && run[i + 1][1] < a) i++;
      const [t0, a0] = run[i], [t1, a1] = run[i + 1];
      return a1 > a0 ? t0 + (a - a0) / (a1 - a0) * (t1 - t0) : t0;
    };
    const D = route.d0s || [], add = {}, addC = {};
    let got = 0;
    for (const run of runs) {
      const aMin = run[0][1], aMax = run[run.length - 1][1];
      for (let k = 0; k < D.length; k++) {
        const d0 = D[k], d1 = k + 1 < D.length ? D[k + 1] : route.length, meters = d1 - d0;
        if (meters < 10 || d0 < aMin - 3 || d1 > aMax + 3) continue; // tratto non percorso tutto in questo pezzo
        const dt = (tAt(run, d1) - tAt(run, d0)) / 1000;
        if (!(dt > 0) || meters / dt > 25 || meters / dt < 0.3) continue; // velocita' impossibile: dato scartato
        const de = route.edges[k], e = de >> 1, dir = de & 1, w = W[EDGES[e][2]];
        const full = Math.abs(meters - EDGES[e][3]) < 2;
        const model = R.edgeTime(e, dir, 'moto', full ? null : meters / EDGES[e][3], true);
        const key = w[0] + ':' + dir;
        const a = add[key] || (add[key] = [0, 0]); a[0] += dt; a[1] += meters;
        const c = addC[w[2]] || (addC[w[2]] = [0, 0]); c[0] += dt; c[1] += model;
        got++;
      }
    }
    if (!got) return !!r.counted;
    // i viaggi recenti pesano di piu' (le abitudini e il traffico cambiano)
    for (const key in add) {
      const o = TEMPI.w[key] || [0, 0, 0];
      TEMPI.w[key] = [Math.round((o[0] * 0.8 + add[key][0]) * 10) / 10, Math.round(o[1] * 0.8 + add[key][1]), Math.min(20, o[2] + 1)];
    }
    for (const c in addC) {
      const o = TEMPI.c[c] || [0, 0];
      TEMPI.c[c] = [Math.round(o[0] * 0.95 + addC[c][0]), Math.round(o[1] * 0.95 + addC[c][1])];
    }
    const keys = Object.keys(TEMPI.w); // al massimo 4000 vie ricordate (le meno usate si dimenticano)
    if (keys.length > 4000) keys.sort((x, y) => TEMPI.w[x][2] - TEMPI.w[y][2]).slice(0, keys.length - 4000).forEach(k => delete TEMPI.w[k]);
    if (!r.counted) TEMPI.viaggi++;
    store.set('scooter-tempi', TEMPI); applyLearned();
    return true; // questo viaggio e' stato contato
  }
  function saveTrip() {
    const t = nav.trip; nav.trip = null;
    if (!t || t.rer > 0 || t.len < 400) return; // solo viaggi puliti, senza ricalcoli
    const real = (Date.now() - t.t0) / 1000;
    const k = real / t.pred; if (!(k > 0.3 && k < 3.5)) return;
    TRIPS = [...TRIPS, { d: Date.now(), h: t.h, k: Math.round(k * 100) / 100, km: Math.round(t.len) / 1000, min: Math.round(real / 6) / 10 }].slice(-40);
    store.set('scooter-viaggi', TRIPS);
  }
  function reroute(p, announce, heading) {
    nav.lastReroute = Date.now();
    if (nav.trip && !nav.first) nav.trip.rer++;
    R.setTime(new Date());
    // se ti stai muovendo, il nuovo percorso parte nella tua direzione di marcia
    if (heading == null && (nav.speed || 0) > 2) heading = nav.heading;
    const r = R.route(p, state.to.p, 'moto', { heading });
    if (!r) { toast('Non trovo un percorso da qui'); return; }
    const counted = recFlush(); // il pezzo gia' fatto vale comunque per imparare (true = viaggio gia' contato)
    state.moto = r; state.car = null; prepRoute(r); recStart();
    if (nav.rec && counted) nav.rec.counted = true; // stesso viaggio: non contarlo due volte
    nav.announce = typeof announce === 'string' ? announce : announce ? 'Ricalcolo il percorso. ' : '';
    nav.fixT = 0;
    update(p, { acc: nav.acc, heading, speed: nav.speed });
  }
  function renderNav(nt, remaining) {
    const ic2 = k => `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${TURN_IC[k] || TURN_IC.dritto}</svg>`;
    if (nt) {
      document.getElementById('nt-ic').innerHTML = ic2(nt.st.turn);
      document.getElementById('nt-dist').textContent = round(nt.dist) + ' m';
      document.getElementById('nt-name').innerHTML = (nt.st.turn === 'rotonda' ? `Rotonda: ${esc(nt.st.exitName)} uscita, ${esc(nt.st.verso)}<br>` : '') + esc(nt.st.name) + (nt.st.motoOnly ? '<span class="tag">solo moto</span>' : '');
    } else {
      document.getElementById('nt-ic').innerHTML = ic2('arrivo');
      document.getElementById('nt-dist').textContent = round(remaining) + ' m';
      document.getElementById('nt-name').textContent = 'Arrivo: ' + (state.to ? state.to.label : '');
    }
    const secs = Math.max(0, nav.route.time - timeAt(nav.along)) * timeFactor().f;
    const eta = new Date(Date.now() + secs * 1000);
    document.getElementById('nb-min').textContent = Math.max(1, Math.round(secs / 60)) + ' min';
    document.getElementById('nb-rest').textContent = `${fmtKm(remaining)} · arrivo alle ${String(eta.getHours()).padStart(2, '0')}:${String(eta.getMinutes()).padStart(2, '0')}`;
    recenter.hidden = nav.follow;
    recenter.style.bottom = (navbot.getBoundingClientRect().height + 24) + 'px';
  }
  async function keepAwake() {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible') nav.wake = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (nav.on && document.visibilityState === 'visible') keepAwake(); });

  function startNav(sim) {
    if (!state.moto || !state.to) return;
    stopLocate(); // in navigazione il GPS lo ascolta la navigazione stessa
    nav.on = true; nav.sim = sim; nav.follow = true; nav.first = !sim; nav.arrived = false; nav.pos = null;
    nav.speed = null; nav.fixT = 0; nav.acc = 5; nav.disp = null; nav.goodT = Date.now(); nav.weak = false; nav.outWarned = false;
    nav.trip = sim ? null : { t0: Date.now(), pred: state.moto.time, len: state.moto.length, rer: 0, h: new Date().getHours() };
    prepRoute(state.moto); recStart();
    document.body.classList.add('navmode'); navtop.hidden = false; navbot.hidden = false;
    view.s = 1.3; view.oy = 0.66;
    // subito centrata sull'inizio del percorso e girata nel verso di marcia, anche prima del primo segnale GPS
    { const L0 = state.moto.line, h0 = L0.length > 1 ? Math.atan2(L0[1][1] - L0[0][1], L0[1][0] - L0[0][0]) : Math.PI / 2;
      nav.disp = L0[0].slice(); nav.heading = h0; view.rot = Math.PI / 2 - h0; view.cx = nav.disp[0]; view.cy = nav.disp[1]; }
    nav.announce = null;
    say((sim ? 'Simulazione. Partiamo. ' : 'Partiamo. ') + instruction(nextTurn(), nav.route.length));
    keepAwake();
    if (sim) {
      nav.simD = 0; const speed = 8.5 * 3; // circa 30 km/h, 3 volte più veloce
      nav.simT = setInterval(() => {
        nav.simD += speed * 0.25;
        const L = nav.route.line, cum = nav.cum; let i = 0;
        while (i < cum.length - 2 && cum[i + 1] < nav.simD) i++;
        if (nav.simD >= cum[cum.length - 1]) nav.simD = cum[cum.length - 1];
        const t = cum[i + 1] > cum[i] ? (nav.simD - cum[i]) / (cum[i + 1] - cum[i]) : 0;
        update([L[i][0] + (L[i + 1][0] - L[i][0]) * t, L[i][1] + (L[i + 1][1] - L[i][1]) * t], { acc: 5, speed });
      }, 250);
    } else {
      if (!navigator.geolocation) { toast('Questo telefono non dà la posizione al browser'); stopNav(); return; }
      toast('Cerco il segnale GPS…');
      nav.watch = navigator.geolocation.watchPosition(pos => {
        if (!nav.on) return;
        const c = pos.coords, now = Date.now(), acc = c.accuracy || 999;
        if (now - pos.timestamp > 5000) return; // lettura vecchia
        // letture imprecise: si ignorano finche' ne arrivano di buone; dopo 10 s senza, si usano lo stesso
        if (acc > 65 && now - nav.goodT < 10000) return;
        if (acc > 200) return;
        if (acc <= 65) nav.goodT = now;
        const weak = acc > 65;
        if (weak && !nav.weak) toast('Segnale GPS debole: la posizione è meno precisa');
        nav.weak = weak;
        const xy = geoToXY(c);
        if (!inBounds(xy)) { toast('Sei fuori dalla mappa'); return; }
        if (!inArea(xy) && !nav.outWarned) { nav.outWarned = true; toast('Sei fuori dalla zona coperta: qui le regole delle strade possono essere incomplete'); }
        const moving = c.speed != null && !isNaN(c.speed) && c.speed > 1.5;
        const h = moving && c.heading != null && !isNaN(c.heading) ? (90 - c.heading) * Math.PI / 180 : null;
        update(xy, { acc, heading: h, speed: c.speed != null && !isNaN(c.speed) ? c.speed : null });
      }, () => { toast('Non riesco a leggere la posizione: controlla i permessi di Safari'); }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
    }
    renderNav(nextTurn(), nav.route.length); startAnim();
  }
  function stopNav() {
    if (!nav.on) return;
    nav.on = false;
    if (nav.raf) cancelAnimationFrame(nav.raf); nav.raf = 0;
    recFlush();
    if (nav.simT) clearInterval(nav.simT); nav.simT = null;
    if (nav.watch != null && navigator.geolocation) navigator.geolocation.clearWatch(nav.watch); nav.watch = null;
    try { if (nav.wake) nav.wake.release(); } catch (e) {} nav.wake = null;
    try { speechSynthesis.cancel(); } catch (e) {}
    document.body.classList.remove('navmode'); navtop.hidden = true; navbot.hidden = true; recenter.hidden = true; closePick.hidden = true;
    view.rot = 0; view.oy = 0.5; nav.pos = null; nav.disp = null;
    compute(false); render(); fitRoute();
  }
  document.getElementById('nb-stop').addEventListener('click', stopNav);
  // ---------- Strada chiusa (in guida) ----------
  // Mostra la via dove sei e le prossime del percorso (entro 400 m): quella scelta viene evitata per 3 giorni.
  const closePick = document.getElementById('closepick');
  function upcomingStreets() {
    const r = nav.route, D = r.d0s || [], out = [];
    for (let k = 0; k < D.length && out.length < 3; k++) {
      const d1 = k + 1 < D.length ? D[k + 1] : r.length;
      if (d1 <= nav.along || D[k] > nav.along + 400) continue;
      const w = W[EDGES[r.edges[k] >> 1][2]], nm = NAMES[w[1]] || 'Strada senza nome';
      const last = out[out.length - 1];
      if (last && last.nm === nm) { if (!last.osm.includes(w[0])) last.osm.push(w[0]); continue; }
      out.push({ nm, osm: [w[0]], here: D[k] <= nav.along });
    }
    return out;
  }
  document.getElementById('nb-closed').addEventListener('click', () => {
    if (!nav.on || !nav.route) return;
    const list = upcomingStreets();
    closePick.innerHTML = '<h4>Quale strada è chiusa?</h4>';
    list.forEach(st => {
      const b = document.createElement('button'); b.className = 'btn fix'; b.type = 'button';
      b.textContent = st.nm + (st.here ? ' (qui)' : '');
      b.onclick = async () => {
        closePick.hidden = true;
        for (const osm of st.osm) await setCorrection(osm, 'chiusa', st.nm, { fino: closeUntil(3) }, true);
        toast(`Evito ${st.nm} per 3 giorni`);
        reroute(nav.pos || nav.disp, `Va bene, evito ${st.nm}. `, (nav.speed || 0) > 2 ? nav.heading : undefined);
      };
      closePick.appendChild(b);
    });
    const c = document.createElement('button'); c.className = 'btn'; c.type = 'button'; c.textContent = 'Annulla';
    c.onclick = () => { closePick.hidden = true; };
    closePick.appendChild(c);
    closePick.hidden = false;
  });
  recenter.addEventListener('click', () => { nav.follow = true; startAnim(); });
  function voiceIcon() {
    document.getElementById('nb-wave').style.display = nav.voice ? '' : 'none';
    document.getElementById('nb-mute').style.display = nav.voice ? 'none' : '';
    document.getElementById('nb-voice').setAttribute('aria-label', nav.voice ? 'Voce accesa' : 'Voce spenta');
  }
  document.getElementById('nb-voice').addEventListener('click', () => {
    nav.voice = !nav.voice; try { localStorage.setItem('scooter-voce', nav.voice ? 'si' : 'no'); } catch (e) {}
    voiceIcon(); if (nav.voice) say('Voce accesa.'); else try { speechSynthesis.cancel(); } catch (e) {}
  });
  voiceIcon();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

  readColors(); syncInputs(); compute(false); render(); place(); resize(); fitRoute();
  loadBg(); // lo sfondo arriva dopo: l'app e' gia' usabile
  // Partenza automatica dalla posizione attuale (se il telefono la concede), anche quando riapri l'app
  function autoLocate() {
    if (nav.on || !navigator.geolocation) return;
    if (state.from && !state.from.gps && state.from.manual) return; // partenza scelta a mano: non toccarla
    let first = true;
    locatePrecise(fix => {
      if (nav.on || (state.from && !state.from.gps && state.from.manual)) { stopLocate(); return; }
      if (!inBounds(fix.p)) return;
      setGpsFrom('from', fix, first); first = false;
    });
  }
  autoLocate();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') autoLocate(); });
  if (document.fonts) document.fonts.ready.then(() => { place(); redraw(); });
})();
</script>
</body>
</html>
